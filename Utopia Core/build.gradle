plugins {
    id 'fabric-loom' version '1.3-SNAPSHOT'
    id 'maven-publish'
}  

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://jitpack.io" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://maven.nucleoid.xyz/" }
    maven { url "https://maven.jamieswhiteshirt.com/libs-release/" }
    maven { url "https://maven.bai.lol" }
    maven { url "https://maven.ladysnake.org/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LibZ
    modApi ('maven.modrinth:libz:1.0.2+1.20.1') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // Cloth
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // ModMenu
    modCompileOnly modRuntimeOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Wthit
    modCompileOnly ("mcp.mobius.waila:wthit-api:fabric-8.2.0")
	// Jade
    modCompileOnly ('maven.modrinth:jade:11.0.3'){
		exclude(group: "net.fabricmc.fabric-api")
	}
	// MCDA
	modCompileOnly ('curse.maven:mcda-426206:3821450') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // DragonLoot
	modCompileOnly ('maven.modrinth:dragonloot:1.1.2') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // Trinkets
    modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.2")
	modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.2")
    modCompileOnly ('maven.modrinth:trinkets:3.7.1') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // REI
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:9.0.472"
    // EMI
    modCompileOnly "dev.emi:emi:0.4.0+1.19"

    // Dualwielding
	modCompileOnly ('maven.modrinth:dualwielding:1.1.3+1.20.1') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // PlaceHolder
    modCompileOnly ("eu.pb4:placeholder-api:2.1.1+1.20")
    // Inmis
	modCompileOnly ("curse.maven:inmis-369254:3853651") {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // CosmeticArmor
    modCompileOnly ('maven.modrinth:cosmetic-armor:1.5.0') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // TreeChop
    modCompileOnly ('maven.modrinth:treechop:0.18.3') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // Alloygery
    modCompileOnly ('maven.modrinth:alloygery:2.5.5+1.19.2') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // Magna
    modCompileOnly ('com.github.Draylar:magna:1.8.0-1.19.2') {
		exclude(group: "net.fabricmc.fabric-api")
	}
    // Spell-Engine
    modCompileOnly ('maven.modrinth:spell-engine:0.9.24+1.19-fabric') {
		exclude(group: "net.fabricmc.fabric-api")
	}
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version, "cloth_config_version": project.cloth_config_version
	}
}

tasks.register("verifyStarterProgression") {
    group = "verification"
    description = "Verifies the intentionally free wooden/stone tier and guards nearby restrictions."

    def itemDataDir = file("src/main/resources/data/levelz/item")
    def expectedFree = [
        "axe_wood_unlock.json"  : [skill: "farming",  level: 0, item: "minecraft:axe",   material: "wood"],
        "hoe_wood_unlock.json"  : [skill: "farming",  level: 0, item: "minecraft:hoe",   material: "wood"],
        "sword_wood_unlock.json": [skill: "strength", level: 0, item: "minecraft:sword", material: "wood"],
        "tool_wood_unlock.json" : [skill: "mining",   level: 0, item: "minecraft:tool",  material: "wood"],
        "axe_stone_unlock.json" : [skill: "farming",  level: 0, item: "minecraft:axe",   material: "stone"],
        "hoe_stone_unlock.json" : [skill: "farming",  level: 0, item: "minecraft:hoe",   material: "stone"],
        "sword_stone_unlock.json": [skill: "strength", level: 0, item: "minecraft:sword", material: "stone"],
        "tool_stone_unlock.json" : [skill: "mining",   level: 0, item: "minecraft:tool",  material: "stone"]
    ]
    def expectedRestricted = [
        "bow_unlock.json"            : [skill: "archery", level: 1],
        "bucket_unlock.json"         : [skill: "farming", level: 1],
        "armor_leather_unlock.json"  : [skill: "defense", level: 1],
        "armor_chainmail_unlock.json": [skill: "defense", level: 4],
        "axe_iron_unlock.json"       : [skill: "farming", level: 8],
        "hoe_iron_unlock.json"       : [skill: "farming", level: 8],
        "sword_iron_unlock.json"     : [skill: "strength", level: 8],
        "tool_iron_unlock.json"      : [skill: "mining", level: 8]
    ]
    inputs.files((expectedFree.keySet() + expectedRestricted.keySet()).collect { new File(itemDataDir, it) })
    inputs.dir("src/main/resources/data/levelz").optional()

    doLast {
        def parser = new groovy.json.JsonSlurper()
        (expectedFree + expectedRestricted).each { fileName, expected ->
            def source = new File(itemDataDir, fileName)
            if (!source.isFile()) {
                throw new GradleException("Missing progression resource: ${source}")
            }
            def actual = parser.parse(source)
            expected.each { field, value ->
                if (actual[field] != value) {
                    throw new GradleException("${fileName}: expected ${field}=${value}, found ${actual[field]}")
                }
            }
        }

        def freeRecipeOutputs = [
            "minecraft:wooden_axe", "minecraft:wooden_hoe", "minecraft:wooden_pickaxe",
            "minecraft:wooden_shovel", "minecraft:wooden_sword", "minecraft:stone_axe",
            "minecraft:stone_hoe", "minecraft:stone_pickaxe", "minecraft:stone_shovel",
            "minecraft:stone_sword"
        ] as Set
        def craftingDir = file("src/main/resources/data/levelz/crafting")
        if (craftingDir.isDirectory()) {
            fileTree(craftingDir).matching { include "**/*.json" }.each { source ->
                def data = parser.parse(source)
                def lockedItems = data.item instanceof Collection ? data.item as Set : [] as Set
                def conflicts = lockedItems.intersect(freeRecipeOutputs)
                if (!conflicts.isEmpty()) {
                    throw new GradleException("${source}: starter-tier recipes must stay craftable: ${conflicts}")
                }
            }
        }
    }
}

tasks.named("check") {
    dependsOn("verifyStarterProgression")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
