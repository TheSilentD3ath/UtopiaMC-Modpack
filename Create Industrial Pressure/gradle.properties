org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Info
maven_group = net.shiro
archives_base_name = create-high-pressure-pipes
mod_version = 0.1.0

minecraft_version = 1.20.1

# Dependencies
# https://fabricmc.net/develop
# Create Fabric 6.0.8.1 itself requires Loader >= 0.17.2 and Fabric API >= 0.92.6; with anything lower
# runClient stops at mod resolution. The pack ships Loader 0.18.4; to test on exactly that, run with
# -Pfabric_loader_version=0.18.4.
fabric_loader_version = 0.17.2
fabric_api_version = 0.92.6+1.20.1

# Mappings
# https://parchmentmc.org/docs/getting-started
parchment_version = 2023.09.03

# Create Fabric (Create 6). Compile against your EXACT runtime version via artifact "create-fabric"
# (see build.gradle). Modrinth version string is the maven version. fabric.mod.json: "create >=6.0.0".
create_version = 6.0.8.1+build.1744-mc1.20.1

# Development QOL
modmenu_version = 7.1.0

# Recipe viewer enabled at runtime: jei | rei | emi | disabled
recipe_viewer = disabled
jei_version = 15.2.0.22
rei_version = 12.0.626
emi_version = 1.1.18+1.20.1
